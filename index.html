<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }
    body {
      display: grid;
      place-items: center;
      font-family: "Courier New", monospace;
    }
    #answer {
      width: min(420px, calc(100vw - 48px));
      height: 48px;
      padding: 0 14px;
      border: 1px solid #111;
      border-radius: 0;
      outline: none;
      background: #000;
      color: #bdbdbd;
      font: 16px "Courier New", monospace;
      caret-color: #b00000;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }
    #answer:focus {
      border-color: #292929;
      box-shadow: 0 0 18px rgba(100, 0, 0, .08);
    }
    #error {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000;
      color: #a00000;
      font: 900 clamp(28px, 7vw, 76px) "Courier New", monospace;
      letter-spacing: .08em;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #error.show {
      visibility: visible;
      pointer-events: auto;
      animation: reveal 120ms steps(2, end) forwards, pulse 700ms steps(2, end) infinite 120ms;
    }
    #error span {
      animation: distort 180ms steps(2, end) infinite;
      text-shadow: 4px 0 #260000, -3px 0 #4a0000;
    }
    @keyframes reveal {
      0% { opacity: 0; transform: translateX(0); }
      30% { opacity: 1; transform: translateX(-5px); }
      60% { opacity: .3; transform: translateX(4px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes pulse {
      0%, 100% { background: #000; }
      50% { background: #080000; }
    }
    @keyframes distort {
      0% { transform: translateX(0) skewX(0); }
      50% { transform: translateX(2px) skewX(-2deg); }
      100% { transform: translateX(-2px) skewX(1deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #error.show, #error span { animation: none; }
    }
  </style>
</head>
<body>
  <input
    id="answer"
    type="text"
    autocomplete="off"
    autocapitalize="off"
    spellcheck="false"
    aria-label="Answer"
  >
  <div id="error" role="alert" aria-live="assertive"><span>INCORRECT ANSWER</span></div>

  <script>
    const input = document.getElementById("answer");
    const error = document.getElementById("error");
    const accepted = new Set(["spider-man", "spider man", "spiderman"]);
    let errorTimer;

    function validate() {
      const value = input.value.trim().toLowerCase();
      if (!value) {
        error.classList.remove("show");
        return;
      }
      if (accepted.has(value)) {
        clearTimeout(errorTimer);
        error.classList.remove("show");
        input.value = "";
        input.blur();
      } else {
        error.classList.add("show");
        clearTimeout(errorTimer);
        errorTimer = setTimeout(() => {
          error.classList.remove("show");
          input.value = "";
          input.focus();
        }, 1800);
      }
    }

    input.addEventListener("keydown", event => {
      if (event.key === "Enter") validate();
    });
    input.addEventListener("input", () => {
      if (error.classList.contains("show")) {
        clearTimeout(errorTimer);
        error.classList.remove("show");
      }
    });
  </script>
</body>
</html>
